name: zowl

x-zowl-environment: &zowl-environment
  NODE_ENV: production
  DATABASE_URL: /var/lib/zowl/data/zowl.sqlite
  FILE_STORAGE_ROOT: /var/lib/zowl/storage
  ANDROID_RELEASE_ROOT: /var/lib/zowl/releases/android
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public HTTPS URL}
  INITIAL_ADMIN_SETUP_TOKEN_FILE: /run/zowl-secrets/initial-admin-setup-token
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  RECEIPT_RECOGNITION_PROVIDER: ${RECEIPT_RECOGNITION_PROVIDER:-mock}
  AI_CATEGORIZATION_PROVIDER: ${AI_CATEGORIZATION_PROVIDER:-off}
  AI_CATEGORIZATION_RESPONSE_MODE: ${AI_CATEGORIZATION_RESPONSE_MODE:-json_schema}
  AI_CATEGORIZATION_AUTO_THRESHOLD: ${AI_CATEGORIZATION_AUTO_THRESHOLD:-0.85}
  AI_CATEGORIZATION_BATCH_SIZE: ${AI_CATEGORIZATION_BATCH_SIZE:-20}
  AI_CATEGORIZATION_TIMEOUT_MS: ${AI_CATEGORIZATION_TIMEOUT_MS:-30000}
  AI_CATEGORIZATION_ALLOW_INSECURE_HTTP: ${AI_CATEGORIZATION_ALLOW_INSECURE_HTTP:-false}
  # Encrypts the AI provider API key a user saves on the settings page. Without
  # it the page cannot store a key, so a provider that needs one cannot be used.
  AI_CATEGORIZATION_ENCRYPTION_KEY: ${AI_CATEGORIZATION_ENCRYPTION_KEY:-}

x-zowl-data-volume: &zowl-data-volume
  type: bind
  source: ${ZOWL_DATA_DIR:-./runtime/data}
  target: /var/lib/zowl/data

x-zowl-storage-volume: &zowl-storage-volume
  type: bind
  source: ${ZOWL_STORAGE_DIR:-./runtime/storage}
  target: /var/lib/zowl/storage

services:
  app:
    image: ${ZOWL_IMAGE:-zowl:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *zowl-environment
    ports:
      - "127.0.0.1:${ZOWL_PORT:-3000}:3000"
    expose:
      - "3000"
    volumes:
      - *zowl-data-volume
      - *zowl-storage-volume
      - type: bind
        source: ${ANDROID_RELEASE_DIR:-./runtime/releases/android}
        target: /var/lib/zowl/releases/android
        read_only: true
      - type: bind
        source: ${ZOWL_SECRETS_DIR:?Set ZOWL_SECRETS_DIR to the persistent secrets directory}
        target: /run/zowl-secrets
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    tmpfs:
      - /tmp:size=64m,mode=1777
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${ZOWL_TRAEFIK_NETWORK:-traefik-proxy}"
      traefik.http.routers.zowl.rule: "Host(`${ZOWL_HOST:?Set ZOWL_HOST to the public host name}`)"
      traefik.http.routers.zowl.entrypoints: "${ZOWL_TRAEFIK_ENTRYPOINT:-web}"
      traefik.http.routers.zowl.service: "zowl"
      traefik.http.services.zowl.loadbalancer.server.port: "3000"
    networks:
      - default
      - traefik-proxy
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  traefik-proxy:
    external: true
    name: ${ZOWL_TRAEFIK_NETWORK:-traefik-proxy}
