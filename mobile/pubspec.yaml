name: zowl_mobile
description: "Zowl iOS and Android client."
publish_to: "none"
version: 1.0.30+43

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^16.2.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.2
  riverpod: ^3.3.2

flutter:
  uses-material-design: true
  # Nunito (SIL Open Font License, see assets/fonts/Nunito-OFL.txt), Latin subset.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/zowl-icon.png
  adaptive_icon_background: "#F1ECE3"
  adaptive_icon_foreground: assets/brand/zowl-foreground.png
  adaptive_icon_monochrome: assets/brand/zowl-monochrome.png
  remove_alpha_ios: true
